name: .NET CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (.NET 10)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AgenticForge.slnx

      - name: Build
        run: dotnet build AgenticForge.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test AgenticForge.slnx --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"
