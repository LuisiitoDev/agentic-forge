name: forge-dashboard

# Publishes the status page in site/ to GitHub Pages. The data (site/data/runs.json) is rebuilt from the
# Actions runs of the forge-*-claude workflows. No model runs here.
#
# Requires: Settings > Pages > Source = "GitHub Actions".

on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths: ["site/**", ".github/forge/dashboard/**", ".github/workflows/forge-dashboard.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-dashboard
  cancel-in-progress: false

jobs:
  build:
    name: Build status data
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build runs.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/forge/dashboard/build_status.py site/data/runs.json
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
