name: forge-spike-start

# Spike. Starts forge-spike the way the orchestrator starts an agent: workflow_dispatch with the workflow
# token, not by a human. Run it by hand from the Actions tab. Remove after the first run.

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch forge-spike with the workflow token
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          gh workflow run forge-spike.lock.yml --repo "$REPO" --ref "$REF" -f target="$REPO" -f issue=1
