name: forge-spike-start

# Spike. Runs the orchestrator's own `dispatch` and `await_run` (.github/forge/orchestrate.sh, ADR-0018) against
# forge-spike on real GitHub, with the workflow token: it dispatches the agent, finds its run by title, waits for it
# and reads its conclusion. Run it by hand from the Actions tab. Remove after the first run.

on:
  workflow_dispatch:
    inputs:
      model:
        description: Copilot model id for forge-spike
        required: true
        type: string

permissions:
  actions: write
  contents: read

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the orchestration script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/forge
          persist-credentials: false

      - name: Dispatch forge-spike and wait for it like the orchestrator does
        env:
          ENGINE_TOKEN: ${{ github.token }}
          TARGET_TOKEN: not-used
          ENGINE_REPO: ${{ github.repository }}
          ENGINE_REF: ${{ github.ref_name }}
          TARGET: ${{ github.repository }}
          ISSUE: "1"
          MODEL: ${{ inputs.model }}
          FORGE_BOT_LOGIN: not-used
          RUN_URL: not-used
          AWAIT_INTERVAL: "10"
        run: |
          set -euo pipefail
          source .github/forge/orchestrate.sh
          dispatch forge-spike 1 -f model="$MODEL"
          rc=0; await_run "$PENDING_AGENT" "$PENDING_SINCE" || rc=$?
          {
            echo "## await_run result"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| return code | \`$rc\` (0 completed, 1 no run found, 2 too slow, 3 token budget) |"
            echo "| agent | \`${AGENT:-}\` |"
            echo "| conclusion | \`${CONCLUSION:-}\` |"
            echo "| run_started_at | \`${RUN_STARTED_AT:-}\` |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$rc" -eq 0 ]
