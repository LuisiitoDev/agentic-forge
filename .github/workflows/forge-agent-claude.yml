name: forge-agent-claude
# Reusable workflow: one Forge agent on Claude Code, inside the AWF firewall, authenticated with the OAuth token of
# `claude setup-token` (secret CLAUDE_CODE_OAUTH_TOKEN). Called by forge-<agent>-claude.yml. See ADR-0022.
#   agent job   reads the request, runs Claude with no GitHub write access, and collects what it changed as a patch.
#   deliver job validates the result and the changes, publishes them and posts the result. Only it can write.
on:
  workflow_call:
    inputs:
      agent:
        description: "One of ba, planner, coder or reviewer"
        required: true
        type: string
      target:
        description: "Target repository, owner/name"
        required: true
        type: string
      issue:
        description: "Request issue number in the target"
        required: true
        type: string
      thread:
        description: "Issue or pull request number where the result is posted"
        required: true
        type: string
      target_repo_name:
        description: "Target repository name without the owner"
        required: true
        type: string
      pr:
        description: "Plan pull request number (empty on the first planning pass)"
        required: false
        type: string
        default: ""
      ref:
        description: "Plan branch (empty on the first planning pass)"
        required: false
        type: string
        default: ""
permissions: {}

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON('{"ba":20,"planner":45,"coder":60,"reviewer":45}')[inputs.agent] }}
    permissions:
      contents: read
    steps:
      - name: Checkout the engine (prompts and scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: engine
          fetch-depth: 1
          persist-credentials: false

      - name: Configure the agent
        id: cfg
        env:
          AGENT: ${{ inputs.agent }}
        run: python3 engine/.github/forge/claude/configure_agent.py

      - name: Derive the target owner
        id: owner
        env:
          TARGET: ${{ inputs.target }}
        run: echo "owner=${TARGET%%/*}" >> "$GITHUB_OUTPUT"

      # Read-only token, scoped to the one target repository. The Reviewer also reads CI runs and security alerts.
      - name: Generate a read-only GitHub App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.FORGE_APP_ID }}
          private-key: ${{ secrets.FORGE_APP_KEY }}
          owner: ${{ steps.owner.outputs.owner }}
          repositories: ${{ inputs.target_repo_name }}
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
          permission-actions: ${{ inputs.agent == 'reviewer' && 'read' || '' }}
          permission-security-events: ${{ inputs.agent == 'reviewer' && 'read' || '' }}
          permission-vulnerability-alerts: ${{ inputs.agent == 'reviewer' && 'read' || '' }}

      - name: Checkout the target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.target }}
          path: target
          ref: ${{ inputs.ref }}
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0
          persist-credentials: false

      # Untrusted data: the agent reads it from files, it never goes through an expression.
      - name: Fetch the request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TARGET: ${{ inputs.target }}
          ISSUE: ${{ inputs.issue }}
          PR: ${{ inputs.pr }}
          FORGE_BOT_LOGIN: ${{ vars.FORGE_BOT_LOGIN }}
        run: python3 engine/.github/forge/claude/fetch_request.py request

      # The model comes from the trusted results and the plan, by a fixed table (ADR-0027). Never from the request text.
      - name: Choose the model
        id: model
        env:
          AGENT: ${{ inputs.agent }}
          PR: ${{ inputs.pr }}
          FORGE_SENSITIVE_PATHS: ${{ vars.FORGE_SENSITIVE_PATHS }}
          FORGE_MODEL_BA: ${{ vars.FORGE_MODEL_BA }}
          FORGE_MODEL_PLANNER: ${{ vars.FORGE_MODEL_PLANNER }}
          FORGE_MODEL_CODER: ${{ vars.FORGE_MODEL_CODER }}
          FORGE_MODEL_REVIEWER: ${{ vars.FORGE_MODEL_REVIEWER }}
        run: python3 engine/.github/forge/claude/choose_model.py request/results.md

      - name: Build the prompt
        env:
          TARGET: ${{ inputs.target }}
          ISSUE: ${{ inputs.issue }}
          THREAD: ${{ inputs.thread }}
          PR: ${{ inputs.pr }}
          REF: ${{ inputs.ref }}
          ENGINE_DIR: engine
          AGENT: ${{ inputs.agent }}
        run: python3 engine/.github/forge/claude/build_prompt.py "$AGENT" > prompt.md

      # A pristine copy of the target, to tell what the agent changed without trusting target/.git.
      - name: Snapshot the target
        run: mkdir .claude-base && tar --exclude=.git -C target -cf - . | tar -C .claude-base -xf -

      - name: Run Claude Code
        uses: ./engine/.github/actions/claude-awf
        with:
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt-file: prompt.md
          model: ${{ steps.model.outputs.model }}
          allowed-tools: ${{ steps.cfg.outputs.tools }}
          disallowed-tools: ${{ steps.cfg.outputs.disallowed }}
          allow-domains: ${{ steps.cfg.outputs.domains }}
          max-turns: ${{ steps.cfg.outputs.turns }}
          output-file: result.md
          github-token: ${{ inputs.agent == 'reviewer' && steps.app.outputs.token || '' }}

      - name: Collect what the agent changed
        if: steps.cfg.outputs.writer == 'true'
        run: |
          mkdir -p artifacts
          python3 engine/.github/forge/claude/collect_changes.py .claude-base target artifacts/changes.patch artifacts/names.txt

      - name: Stage the result
        run: mkdir -p artifacts && cp result.md artifacts/result.md

      - name: Upload the result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-result
          path: artifacts
          retention-days: 7

  deliver:
    needs: agent
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Checkout the engine (scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: engine
          fetch-depth: 1
          persist-credentials: false

      - name: Derive the target owner
        id: owner
        env:
          TARGET: ${{ inputs.target }}
        run: echo "owner=${TARGET%%/*}" >> "$GITHUB_OUTPUT"

      - name: Generate a GitHub App token that can write
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.FORGE_APP_ID }}
          private-key: ${{ secrets.FORGE_APP_KEY }}
          owner: ${{ steps.owner.outputs.owner }}
          repositories: ${{ inputs.target_repo_name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Checkout the target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.target }}
          path: target
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0
          persist-credentials: true

      - name: Download the result
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-result
          path: artifacts

      - name: Deliver
        env:
          AGENT: ${{ inputs.agent }}
          TARGET: ${{ inputs.target }}
          ISSUE: ${{ inputs.issue }}
          THREAD: ${{ inputs.thread }}
          PR: ${{ inputs.pr }}
          REF: ${{ inputs.ref }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ART: artifacts
          ENGINE_DIR: engine
          FORGE_BOT_LOGIN: ${{ vars.FORGE_BOT_LOGIN }}
        run: python3 engine/.github/forge/claude/deliver.py
