name: forge-spike-watch

# Spike. The same trigger and the same title parsing the orchestrator uses for agent results
# (.github/workflows/forge-orchestrator.yml). It only reports what it sees. Remove after the first run.

run-name: forge-spike-watch

on:
  workflow_run:
    workflows: [forge-spike]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report what the event carries
        env:
          TITLE: ${{ github.event.workflow_run.display_title }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_ACTOR: ${{ github.event.workflow_run.triggering_actor.login }}
          STARTED: ${{ github.event.workflow_run.run_started_at }}
        run: |
          set -euo pipefail
          if [[ "$TITLE" =~ ^forge-[a-z]+\ ([A-Za-z0-9._-]+/[A-Za-z0-9._-]+)#([0-9]+)$ ]]; then
            parsed="yes: ${BASH_REMATCH[1]} #${BASH_REMATCH[2]}"
          else
            parsed="NO"
          fi
          {
            echo "## forge-spike-watch fired"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| display_title | \`$TITLE\` |"
            echo "| title parsed like the orchestrator | $parsed |"
            echo "| conclusion | \`$CONCLUSION\` |"
            echo "| event that started the run | \`$RUN_EVENT\` |"
            echo "| triggering actor | \`$RUN_ACTOR\` |"
            echo "| run_started_at | \`$STARTED\` |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
