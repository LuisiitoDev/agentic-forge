<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Argus · Agentic Forge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0907; --bg-2: #14100b;
    --panel-top: rgba(40, 30, 20, .92); --panel-bottom: rgba(18, 14, 10, .95);
    --text: #f3e7d3; --title: #f6e7c8; --muted: #bfa98a; --faint: #9c8a70; --dim: #7d6d57;
    --accent: #ff9a1f; --edge: rgba(255, 160, 60, .22);
    --ok: #7ddc86; --run: #ffb347; --bad: #ff6b5e; --wait: #c4b5fd; --idle: #5b5143; --cancel: #e8c547;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; min-height: 100vh; color: var(--text);
    font: 15px/1.5 Inter, system-ui, sans-serif;
    background:
      radial-gradient(ellipse 60% 45% at 50% 12%, rgba(255, 140, 30, .28), rgba(10, 9, 7, 0) 70%),
      linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 60%);
    background-attachment: fixed;
  }
  a { color: inherit; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 56px 64px 64px; }

  /* Cabecera */
  header { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
  .eye {
    width: 96px; height: 96px; border-radius: 50%; border: 2px solid var(--accent);
    box-shadow: 0 0 60px rgba(255, 140, 30, .45), inset 0 0 28px rgba(255, 140, 30, .35);
    display: flex; align-items: center; justify-content: center;
  }
  .pupil {
    width: 34px; height: 34px; border-radius: 50%;
    background: radial-gradient(circle, #fff3d6 0%, var(--accent) 45%, #5a2a05 100%);
    animation: pulse 3.2s ease-in-out infinite;
  }
  @keyframes pulse { 50% { transform: scale(1.12); filter: brightness(1.2); } }
  @media (prefers-reduced-motion: reduce) { .pupil { animation: none; } }
  h1 { margin: 0; font: 700 52px Cinzel, serif; letter-spacing: .14em; color: var(--title); }
  .brand { font: 600 18px Cinzel, serif; letter-spacing: .4em; color: var(--accent); }
  .tagline { font-size: 13px; letter-spacing: .2em; color: var(--muted); }
  .updated { font-size: 12px; color: var(--faint); }

  .section-title { font: 600 14px Cinzel, serif; letter-spacing: .3em; color: var(--muted); }

  /* Flujo */
  .flow { margin-top: 48px; }
  .flow .section-title { text-align: center; }
  .flow-sub { text-align: center; font-size: 12px; color: var(--faint); margin: 6px 0 20px; }
  .lanes-box { overflow-x: auto; padding: 4px 2px 8px; }
  .lanes { min-width: 980px; display: flex; flex-direction: column; gap: 12px; }
  .lane, .lane-head {
    display: grid; grid-template-columns: 230px repeat(6, minmax(0, 1fr)); gap: 14px; align-items: center;
  }
  .lane-head { padding: 0 15px; font: 600 13px Cinzel, serif; letter-spacing: .08em; color: var(--muted); text-align: center; }
  .lane-head span:first-child { text-align: left; }
  .lane-head small { display: block; font: 400 11px Inter, sans-serif; letter-spacing: 0; color: var(--faint); }
  .lane { position: relative; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--edge); background: rgba(20, 16, 11, .72); }
  .lane::before {
    content: ""; position: absolute; left: 258px; right: 40px; top: 50%; height: 1px;
    background: linear-gradient(90deg, rgba(255, 154, 31, .5), rgba(255, 154, 31, .1));
  }
  .lane-label { min-width: 0; }
  .lane-label a { font-weight: 600; color: var(--title); text-decoration: none; overflow-wrap: anywhere; }
  .lane-label a:hover { text-decoration: underline; }
  .lane-label .meta { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12px; color: var(--faint); flex-wrap: wrap; }
  .stage {
    position: relative; z-index: 1; padding: 10px 8px; border-radius: 12px; text-align: center; display: block; text-decoration: none;
    background: linear-gradient(180deg, var(--panel-top), var(--panel-bottom));
    border: 1px solid var(--c, var(--idle)); box-shadow: 0 0 18px color-mix(in srgb, var(--c, var(--idle)) 20%, transparent);
  }
  .stage.gate { border-style: dashed; }
  a.stage:hover { box-shadow: 0 0 30px color-mix(in srgb, var(--c, var(--idle)) 45%, transparent); }
  .stage .state { font-size: 12px; font-weight: 600; color: var(--c, var(--idle)); }
  .stage .when { font-size: 11px; color: var(--faint); margin-top: 2px; }

  /* Peticiones */
  .requests { margin-top: 52px; }
  .requests-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .hint { font-size: 12px; color: var(--faint); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
  .card {
    padding: 20px; border-radius: 16px; border: 1px solid var(--edge);
    background: linear-gradient(180deg, rgba(36, 27, 18, .94), rgba(16, 13, 9, .96));
  }
  .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .card-title { font-weight: 600; font-size: 16px; color: var(--title); overflow-wrap: anywhere; }
  .card-title a { text-decoration: none; }
  .card-title a:hover { text-decoration: underline; }
  .card-sub { font-size: 12px; color: var(--faint); margin-top: 2px; }
  .badge { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; color: var(--bg); background: var(--c); white-space: nowrap; }
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 16px; }
  .step { border-top: 3px solid var(--c, var(--idle)); padding-top: 8px; }
  .step .n { font-size: 13px; font-weight: 600; color: var(--text); }
  .step .s { font-size: 12px; color: #a8967a; }
  .step a { color: var(--faint); font-size: 12px; }
  .gate-note { margin-top: 14px; font-size: 13px; color: var(--wait); }
  .empty, .error {
    padding: 28px; text-align: center; color: var(--faint); border-radius: 16px;
    border: 1px dashed var(--edge); background: rgba(20, 16, 11, .7);
  }
  .error { color: var(--bad); }

  footer { margin-top: 56px; text-align: center; font-size: 12px; letter-spacing: .2em; color: var(--dim); }

  @media (max-width: 720px) {
    .wrap { padding: 40px 16px 48px; }
    h1 { font-size: 40px; }
    .brand { font-size: 15px; letter-spacing: .3em; }
    .cards { grid-template-columns: 1fr; }
    .steps { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eye" aria-hidden="true"><div class="pupil"></div></div>
    <h1>ARGUS</h1>
    <div class="brand">AGENTIC FORGE</div>
    <div class="tagline">ESTADO DE LOS AGENTES</div>
    <div class="updated" id="updated">Cargando…</div>
  </header>

  <section class="flow" aria-labelledby="flow-title">
    <div class="section-title" id="flow-title">FLUJO</div>
    <div class="flow-sub" id="flow-sub">Todas las peticiones</div>
    <div class="lanes-box">
      <div class="lanes" id="lanes"></div>
    </div>
  </section>

  <section class="requests" aria-labelledby="req-title">
    <div class="requests-head">
      <div class="section-title" id="req-title">PETICIONES</div>
      <div class="hint">Se actualiza cada minuto</div>
    </div>
    <div class="cards" id="list"><div class="empty">Cargando…</div></div>
  </section>

  <footer>GITHUB ACTIONS · CLAUDE CODE · HUMAN APPROVAL</footer>
</div>

<script>
  const AGENTS = [
    { id: "ba", name: "BA", role: "Requisito" },
    { id: "planner", name: "Planner", role: "Plan + PR" },
    { id: "coder", name: "Coder", role: "Implementa" },
    { id: "reviewer", name: "Reviewer", role: "Revisa" },
  ];
  const GATES = [
    { name: "Aprobación", role: "Humano" },
    { name: "Merge", role: "Humano" },
  ];
  const LABEL = {
    running: "En curso", queued: "En cola", success: "Completado", failed: "Fallido", cancelled: "Cancelado",
    done: "Completado", waiting_human: "Esperando humano", idle: "Sin actividad", pending: "Pendiente",
  };
  const COLOR = {
    running: "var(--run)", queued: "var(--idle)", success: "var(--ok)", failed: "var(--bad)", cancelled: "var(--cancel)",
    done: "var(--ok)", waiting_human: "var(--wait)", idle: "var(--idle)", pending: "var(--idle)",
  };
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const ago = iso => {
    if (!iso) return "";
    const m = Math.round((Date.now() - new Date(iso)) / 60000);
    if (m < 1) return "ahora";
    if (m < 60) return `hace ${m} min`;
    if (m < 1440) return `hace ${Math.round(m / 60)} h`;
    return `hace ${Math.round(m / 1440)} d`;
  };
  const issueUrl = r => `https://github.com/${encodeURI(r.target)}/issues/${encodeURIComponent(r.issue)}`;

  function laneHtml(r) {
    const agentNodes = AGENTS.map(a => {
      const st = r.stages[a.id];
      const state = st ? st.state : "pending";
      const inner = `<div class="state">${LABEL[state]}</div>` + (st ? `<div class="when">${ago(st.updated)}</div>` : "");
      return st
        ? `<a class="stage" style="--c:${COLOR[state]}" href="${esc(st.run_url)}" target="_blank" rel="noopener" aria-label="${a.name}: ${LABEL[state]}, ver run">${inner}</a>`
        : `<div class="stage" style="--c:${COLOR[state]}">${inner}</div>`;
    });
    const waiting = r.state === "waiting_human";
    const gateNodes = GATES.map((g, i) => {
      const label = waiting && i === 0 ? "Esperando" : "Pendiente";
      const c = waiting && i === 0 ? "var(--wait)" : "var(--idle)";
      return `<div class="stage gate" style="--c:${c}"><div class="state">${label}</div></div>`;
    });
    return `<div class="lane">
      <div class="lane-label">
        <a href="${issueUrl(r)}" target="_blank" rel="noopener">${esc(r.target)} #${esc(r.issue)}</a>
        <div class="meta"><span class="badge" style="--c:${COLOR[r.state] || "var(--idle)"}">${LABEL[r.state] || esc(r.state)}</span>${ago(r.updated)}</div>
      </div>
      ${agentNodes.concat(gateNodes).join("")}
    </div>`;
  }

  function renderFlow(reqs) {
    const sub = document.getElementById("flow-sub");
    const lanes = document.getElementById("lanes");
    const head = `<div class="lane-head"><span>Petición</span>` +
      AGENTS.concat(GATES).map(s => `<span>${s.name}<small>${s.role}</small></span>`).join("") + `</div>`;
    if (!reqs.length) {
      sub.textContent = "Sin peticiones todavía";
      lanes.innerHTML = head;
      return;
    }
    sub.textContent = reqs.length === 1 ? "1 petición" : `${reqs.length} peticiones`;
    lanes.innerHTML = head + reqs.map(laneHtml).join("");
  }

  function renderRequests(reqs) {
    const list = document.getElementById("list");
    if (!reqs.length) { list.innerHTML = '<div class="empty">Todavía no hay peticiones.</div>'; return; }
    list.innerHTML = reqs.map(r => {
      const steps = AGENTS.map(a => {
        const st = r.stages[a.id];
        if (!st) return `<div class="step"><div class="n">${a.name}</div><div class="s">Pendiente</div></div>`;
        return `<div class="step" style="--c:${COLOR[st.state] || "var(--idle)"}"><div class="n">${a.name}</div>` +
               `<div class="s">${LABEL[st.state] || esc(st.state)} · ${ago(st.updated)}</div>` +
               `<a href="${esc(st.run_url)}" target="_blank" rel="noopener">ver run</a></div>`;
      }).join("");
      const gate = r.state === "waiting_human" ? '<div class="gate-note">Revisión lista: pendiente de aprobación y merge humano</div>' : "";
      return `<article class="card">
        <div class="card-head">
          <div>
            <div class="card-title"><a href="${issueUrl(r)}" target="_blank" rel="noopener">${esc(r.target)} #${esc(r.issue)}</a></div>
            <div class="card-sub">Actualizado ${ago(r.updated)}</div>
          </div>
          <span class="badge" style="--c:${COLOR[r.state] || "var(--idle)"}">${LABEL[r.state] || esc(r.state)}</span>
        </div>
        <div class="steps">${steps}</div>${gate}
      </article>`;
    }).join("");
  }

  async function load() {
    const el = document.getElementById("updated");
    try {
      const res = await fetch("data/runs.json", { cache: "no-store" });
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      const reqs = data.requests || [];
      renderFlow(reqs);
      renderRequests(reqs);
      el.textContent = data.generated ? `Datos de ${ago(data.generated)}` : "Sin datos todavía";
    } catch (e) {
      renderFlow([]);
      document.getElementById("list").innerHTML = '<div class="error">No se pudo cargar data/runs.json</div>';
      el.textContent = "Error al cargar";
    }
  }
  load();
  setInterval(load, 60000);
</script>
</body>
</html>
