<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic Forge · Estado</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #6b7280; --line: #e3e6ec;
    --running: #2563eb; --success: #15803d; --failed: #b91c1c; --queued: #9ca3af;
    --cancelled: #a16207; --waiting: #7c3aed; --idle: #d1d5db;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1117; --card: #181b24; --text: #e6e8ee; --muted: #9aa3b2; --line: #2a2f3c;
      --running: #60a5fa; --success: #4ade80; --failed: #f87171; --queued: #6b7280;
      --cancelled: #facc15; --waiting: #c4b5fd; --idle: #374151;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1117; --card: #181b24; --text: #e6e8ee; --muted: #9aa3b2; --line: #2a2f3c;
    --running: #60a5fa; --success: #4ade80; --failed: #f87171; --queued: #6b7280;
    --cancelled: #facc15; --waiting: #c4b5fd; --idle: #374151;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; }
  header { padding: 24px 16px 8px; max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 28px 0 10px; }
  main { max-width: 1100px; margin: 0 auto; padding: 0 16px 48px; }
  .muted { color: var(--muted); font-size: 13px; }
  .pipeline { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .node { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; text-align: center; font-size: 13px; }
  .node b { display: block; font-size: 14px; margin-bottom: 2px; }
  .gate { border-style: dashed; color: var(--muted); }
  .cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .card-head { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .card-title { font-weight: 600; overflow-wrap: anywhere; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; color: #fff; white-space: nowrap; }
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 12px; }
  .step { border-top: 4px solid var(--idle); padding-top: 6px; font-size: 12px; color: var(--muted); }
  .step b { display: block; color: var(--text); font-size: 13px; }
  .step.success { border-color: var(--success); }
  .step.running { border-color: var(--running); }
  .step.queued { border-color: var(--queued); }
  .step.failed { border-color: var(--failed); }
  .step.cancelled { border-color: var(--cancelled); }
  .step a { color: inherit; }
  .empty, .error { padding: 24px; text-align: center; color: var(--muted); background: var(--card); border: 1px dashed var(--line); border-radius: 12px; }
  .error { color: var(--failed); }
  .s-running { background: var(--running); } .s-success, .s-done { background: var(--success); }
  .s-failed { background: var(--failed); } .s-queued { background: var(--queued); }
  .s-waiting_human { background: var(--waiting); } .s-cancelled { background: var(--cancelled); }
  .s-idle { background: var(--idle); }
  .gate-pill { margin-top: 10px; font-size: 12px; color: var(--waiting); }
  @media (max-width: 640px) {
    .pipeline { grid-template-columns: repeat(2, 1fr); }
    .steps { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<header>
  <h1>Agentic Forge · Estado</h1>
  <span class="muted" id="updated">Cargando…</span>
</header>
<main>
  <h2>Flujo</h2>
  <div class="pipeline">
    <div class="node"><b>BA</b>Requisito</div>
    <div class="node"><b>Planner</b>Plan + PR</div>
    <div class="node"><b>Coder</b>Implementa</div>
    <div class="node"><b>Reviewer</b>Revisa</div>
    <div class="node gate"><b>Aprobación</b>Humano</div>
    <div class="node gate"><b>Merge</b>Humano</div>
  </div>

  <h2>Peticiones</h2>
  <div id="list" class="cards"><div class="empty">Cargando…</div></div>
</main>

<script>
  const LABELS = { ba: "BA", planner: "Planner", coder: "Coder", reviewer: "Reviewer" };
  const STATE = {
    running: "En curso", queued: "En cola", success: "Completado", failed: "Fallido",
    cancelled: "Cancelado", done: "Completado", waiting_human: "Esperando humano", idle: "Sin actividad"
  };
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const ago = iso => {
    if (!iso) return "";
    const m = Math.round((Date.now() - new Date(iso)) / 60000);
    if (m < 1) return "ahora";
    if (m < 60) return `hace ${m} min`;
    if (m < 1440) return `hace ${Math.round(m / 60)} h`;
    return `hace ${Math.round(m / 1440)} d`;
  };

  function render(data) {
    const list = document.getElementById("list");
    const reqs = data.requests || [];
    if (!reqs.length) { list.innerHTML = '<div class="empty">Todavía no hay peticiones.</div>'; return; }
    list.innerHTML = reqs.map(r => {
      const steps = (data.stages || Object.keys(LABELS)).map(s => {
        const st = r.stages[s];
        if (!st) return `<div class="step"><b>${LABELS[s] || s}</b>Pendiente</div>`;
        return `<div class="step ${esc(st.state)}"><b>${LABELS[s] || s}</b>${STATE[st.state] || esc(st.state)} · ${ago(st.updated)}<br>` +
               `<a href="${esc(st.run_url)}" target="_blank" rel="noopener">ver run</a></div>`;
      }).join("");
      const gate = r.state === "waiting_human" ? '<div class="gate-pill">Revisión lista: pendiente de aprobación y merge humano</div>' : "";
      return `<article class="card">
        <div class="card-head">
          <span class="card-title">${esc(r.target)} #${esc(r.issue)}</span>
          <span class="badge s-${esc(r.state)}">${STATE[r.state] || esc(r.state)}</span>
        </div>
        <div class="muted">Actualizado ${ago(r.updated)}</div>
        <div class="steps">${steps}</div>${gate}
      </article>`;
    }).join("");
  }

  async function load() {
    const el = document.getElementById("updated");
    try {
      const res = await fetch("data/runs.json", { cache: "no-store" });
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      render(data);
      el.textContent = `Actualizado ${ago(data.generated)} · se refresca cada minuto`;
    } catch (e) {
      document.getElementById("list").innerHTML = '<div class="error">No se pudo cargar data/runs.json</div>';
      el.textContent = "Error al cargar";
    }
  }
  load();
  setInterval(load, 60000);
</script>
</body>
</html>
